<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Indian Railways Announcement System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(120deg, #0f2027, #203a43, #2c5364);
            min-height: 100vh;
        }

        .card {
            border-radius: 15px;
        }
    </style>
</head>

<body>
    <div class="container d-flex justify-content-center align-items-center min-vh-100">
        <div class="col-md-6">
            <div class="card shadow-lg p-4">
                <h3 class="text-center mb-4">
                    🚆 Railway Announcement System
                </h3>

                {% if success %}
                <div class="alert alert-success text-center">
                    Announcement Generated for Train {{ train_number }}
                </div>
                {% endif %}

                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Train Number</label>
                        <input type="text" class="form-control" name="train_number" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">From Station</label>
                        <input type="text" class="form-control" name="train_from" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Via Station(s)</label>
                        <input type="text" class="form-control" name="train_via">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">To Station</label>
                        <input type="text" class="form-control" name="train_to" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Platform Number</label>
                        <input type="number" class="form-control" name="platform_number" required>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        Generate Announcement
                    </button>
                </form>
                {% if success %}
                <hr>
                <div class="text-center">
                    <h5>🔊 Announcement Ready</h5>
                    <audio controls class="w-100 mt-2">
                        <source src="{{ url_for('static',filename='o.mp3')}}" type="audio/mpeg">
                        Your browser does not support the audio element.
                    </audio>
                </div>
                {% endif %}

            </div>
        </div>
    </div>
</body>

</html>
